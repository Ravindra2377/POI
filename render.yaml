services:
  - type: web
    name: ap-civic-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace=@ap-civic/web -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: ap-civic-api
    runtime: python
    plan: starter
    buildCommand: pip install ./apps/api
    preDeployCommand: cd apps/api && alembic upgrade head
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ap-civic-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: ap-civic-db
    plan: free
    databaseName: ap_civic
    user: ap_civic

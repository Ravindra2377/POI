[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-civic-api"
version = "0.1.0"
description = "API for the Andhra Pradesh civic intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.116.1",
  "GeoAlchemy2==0.20.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.11.7",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]


[tool.setuptools.package-data]
"app.seeds" = ["stage1_seed.json"]
